# Builds the Windows download on GitHub's servers from this repo and the runner at its pinned
# external/resogun-recomp commit, and signs a build attestation for it, so anyone can check that a
# release zip came from the public code: gh attestation verify <zip> -R <repo>.
# Run by hand (Actions > Verified release > Run workflow) to test: the zip is kept as the run's artifact.
# Publishing a release runs it on the release's tag: the CI-built zip and its .sha256 replace the
# release's files of the same name, and the release notes get a "Check this download" section.
# Bump the submodule before tagging: CI builds the commit this repo pins, not a local checkout.
name: Verified release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  STREAMLINE_VERSION: 2.14.16
  # NVIDIA's published digest for streamline-sdk-v2.14.16.zip.
  STREAMLINE_SHA256: 32041e51db0cab709a271b72a352281b690c2abbd669a827809401a5dd23956b

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner at its pinned commit, and its own submodules, without their history.
      - name: Submodules
        run: git submodule update --init --recursive --depth 1 --jobs 4

      # Toolchain as in external/resogun-recomp/.github/workflows/build.yml (docs/building.md).
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        with:
          msystem: CLANG64
          release: false
          update: false
          install: git patch make
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p python:p
            vulkan-headers:p vulkan-loader:p vulkan-memory-allocator:p glslang:p
            sdl3:p fmt:p boost:p robin-map:p xxhash:p zlib:p zydis:p nasm:p
            spirv-tools:p spirv-headers:p spirv-cross:p
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      # DLSS Frame Generation DLLs, shipped beside the program as in the hand-made releases.
      - name: NVIDIA Streamline SDK
        run: |
          zip="$RUNNER_TEMP/streamline.zip"
          curl -fsSL --retry 5 --retry-all-errors -o "$zip" \
            "https://github.com/NVIDIAGameWorks/Streamline/releases/download/v${STREAMLINE_VERSION}/streamline-sdk-v${STREAMLINE_VERSION}.zip"
          echo "$STREAMLINE_SHA256  $zip" | sha256sum --check
          7z x -y -bd "-o$RUNNER_TEMP/streamline" "$zip" > /dev/null
          echo "RESOGUN_STREAMLINE_DIR=$(cygpath -w "$RUNNER_TEMP/streamline/bin/x64")" >> "$GITHUB_ENV"

      # The release's tools/ folder: embeddable Python and Real-ESRGAN, from the sources and hashes
      # in tools/manifest.json (package.py reads them from tools/python-embed and tools/realesrgan).
      - name: Bundled tools
        run: |
          mkdir -p tools/python-embed tools/realesrgan
          embed=tools/python-embed/python-3.13.17-embed-amd64.zip
          curl -fsSL --retry 5 --retry-all-errors -o "$embed" \
            https://www.python.org/ftp/python/3.13.17/python-3.13.17-embed-amd64.zip
          echo "9e35319bffedab8b36ad44d8f377cb4f1733bcec257a0b6d04d94f01486ddb38  $embed" | sha256sum --check
          esrgan="$RUNNER_TEMP/realesrgan.zip"
          curl -fsSL --retry 5 --retry-all-errors -o "$esrgan" \
            https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip
          echo "abc02804e17982a3be33675e4d471e91ea374e65b70167abc09e31acb412802d  $esrgan" | sha256sum --check
          7z x -y -bd -otools/realesrgan "$esrgan" > /dev/null
          echo "07e49f7cbb4ede01ae4dd4c399d3a7e5846e3d2085c3128eff881e55cb7b1a0c  tools/realesrgan/realesrgan-ncnn-vulkan.exe" | sha256sum --check

      - name: Build
        timeout-minutes: 90
        working-directory: external/resogun-recomp
        run: bash build.sh

      # package.py names the zip and its folder after git describe; the release uses the tag instead.
      - name: Package
        id: package
        working-directory: external/resogun-recomp
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python tools/package.py --zip
          release=$(cat dist/release.txt)
          version=${TAG:-dev-${GITHUB_SHA::7}}
          name="everybodys-golf-pc-${version}-windows-x64.zip"
          mkdir -p "$GITHUB_WORKSPACE/out"
          python - "out/${release}.zip" "$GITHUB_WORKSPACE/out/$name" "$release" "everybodys-golf-pc-${version}" <<'PY'
          import sys, zipfile
          src, dst, old, new = sys.argv[1:]
          with zipfile.ZipFile(src) as a, zipfile.ZipFile(dst, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as b:
              for info in a.infolist():
                  data = a.read(info)
                  info.filename = new + info.filename[len(old):] if info.filename.startswith(old + '/') else info.filename
                  b.writestr(info, data)
          PY
          cd "$GITHUB_WORKSPACE/out"
          sha256sum "$name" > "$name.sha256"
          echo "zip=out/$name" >> "$GITHUB_OUTPUT"
          echo "sums=out/$name.sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.zip }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-build
          path: out/
          compression-level: 0

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          ZIP: ${{ steps.package.outputs.zip }}
          SUMS: ${{ steps.package.outputs.sums }}
        run: |
          gh release upload "$TAG" "$ZIP" "$SUMS" --clobber --repo "$GITHUB_REPOSITORY"
          file=$(basename "$ZIP")
          hash=$(sha256sum "$ZIP" | cut -d' ' -f1)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          sed -i '/<!-- verified-build -->/,$d' notes.md
          echo >> notes.md
          cat >> notes.md <<EOF
          <!-- verified-build -->
          ### Check this download
          GitHub built \`$file\` from this release's source code and signed a record of the build. To check your copy, install the [GitHub CLI](https://cli.github.com) and run:

          \`\`\`
          gh attestation verify $file -R $GITHUB_REPOSITORY
          \`\`\`

          SHA-256: \`$hash\`. Search it on [VirusTotal](https://www.virustotal.com/gui/file/$hash).
          EOF
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
